services:
  - type: web
    name: cloudpix-backend
    env: node
    plan: free # Explicitly sets the free tier
    # Build both the API and the Worker
    buildCommand: pnpm install && pnpm run build --filter=@cloudpix/api... && pnpm run build --filter=@cloudpix/worker...
    # Start both processes concurrently in the same free container
    startCommand: (cd apps/api && pnpm run start) & (cd apps/worker && pnpm run start) & wait -n
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3100"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: AWS_SQS_QUEUE_URL
        sync: false
      - key: AWS_SQS_QUEUE_ARN
        sync: false

